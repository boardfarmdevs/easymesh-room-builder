# Test, build and publish the static room builder (GitHub Pages).
# In the repository: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7      # the JS/Python RF model parity test runs under node
        with:
          node-version: "22"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build the static site (downloads the pinned Pyodide release)
        run: python -m roombuilder build-site --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
